name: Publish AUR package and pacman repo

# Packages a prebuilt GitHub Release tarball. This workflow must never
# compile the browser (no ./build.sh, no ./mach build).
on:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: aur-publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  aur:
    name: Update AUR package
    if: >-
      github.event.release.prerelease == false &&
      startsWith(github.event.release.tag_name, 'v') &&
      github.event.release.tag_name != 'pacman-repo'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Point PKGBUILD at this release and its checksum
        env:
          TAG: ${{ github.event.release.tag_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VER="${TAG#v}"
          ASSET="mercury-${VER}.en-US.linux-x86_64.tar.xz"
          gh release download "$TAG" --repo "${{ github.repository }}" -p "$ASSET" -D /tmp/mercury-asset
          SUM="$(sha256sum "/tmp/mercury-asset/${ASSET}" | awk '{print $1}')"
          python3 packaging/arch/update-pkgbuild.py --version "$VER" --tarball-sha256 "$SUM"

      # Pin to the v4.2.0 tag by immutable commit SHA.
      - uses: KSXGitHub/github-actions-deploy-aur@084b0d9b15415bf9cdb65d44dad1efe37a354050 # v4.2.0
        with:
          pkgname: mercury-browser-bin
          pkgbuild: packaging/arch/PKGBUILD
          assets: |
            packaging/arch/mercury-browser.sh
            packaging/arch/mercury-browser.desktop
            packaging/arch/mercury-browser-bin.install
          updpkgsums: "false"
          test: "false"
          commit_username: canonrebel04
          commit_email: 117294984+canonrebel04@users.noreply.github.com
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: Update mercury-browser-bin to ${{ github.event.release.tag_name }}

  pacman-repo:
    name: Update self-hosted pacman repo
    if: >-
      github.event.release.prerelease == false &&
      startsWith(github.event.release.tag_name, 'v') &&
      github.event.release.tag_name != 'pacman-repo'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Download the release tarball
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          VER="${TAG#v}"
          ASSET="mercury-${VER}.en-US.linux-x86_64.tar.xz"
          mkdir -p "$HOME/mercury-asset"
          gh release download "$TAG" --repo "${{ github.repository }}" -p "$ASSET" -D "$HOME/mercury-asset"
          cp "$HOME/mercury-asset/$ASSET" "$GITHUB_WORKSPACE/$ASSET"

      - name: Build .pkg.tar.zst and publish the pacman database
        env:
          PACMAN_GPG_KEY: ${{ secrets.PACMAN_GPG_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          VER="${RELEASE_TAG#v}"
          ASSET="mercury-${VER}.en-US.linux-x86_64.tar.xz"
          docker run --rm \
            -e PACMAN_GPG_KEY \
            -e GH_TOKEN \
            -e GITHUB_REPOSITORY \
            -e RELEASE_TAG \
            -e PACKAGER="canonrebel04 <117294984+canonrebel04@users.noreply.github.com>" \
            -v "$GITHUB_WORKSPACE":/src:rw \
            -w /src \
            archlinux:base-devel \
            bash -lc "
              set -euo pipefail
              pacman -Syu --noconfirm git github-cli gnupg sudo
              useradd -m -u 1001 builder
              echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder
              chown -R builder:builder /src
              su - builder -c 'cd /src && packaging/arch/build-repo.sh --upload --tarball /src/${ASSET}'
            "
